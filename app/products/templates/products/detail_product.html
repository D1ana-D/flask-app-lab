{% extends 'base.html' %}

{% block content %}
<div class="card shadow mt-4">
    <div class="card-body">
        <h2>{{ product.name }}</h2>
        <h4 class="text-success">${{ product.price }}</h4>
        <p class="mt-3">{{ product.content }}</p>
        <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary mt-2">Назад до списку</a>
    </div>
</div>
{% endblock %}
