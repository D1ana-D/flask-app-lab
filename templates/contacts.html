{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4 text-center">Зв'язатися зі мною</h2>
        <form action="#" method="post" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="name" class="form-label">Ваше ім'я</label>
                <input type="text" class="form-control" id="name" placeholder="Введіть ім'я" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Електронна пошта</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Повідомлення</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Ваше повідомлення..." required></textarea>
            </div>
            <button type="button" class="btn btn-primary w-100">Надіслати (заглушка)</button>
        </form>
    </div>
</div>
{% endblock %}
